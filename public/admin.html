<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asiakaspalvelu Chat</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="logo">SC</div><div><h1>Asiakaspalvelu</h1><p>Ylläpidon viestikeskus</p></div></header><section id="login" class="panel"><h2>Ylläpitäjän kirjautuminen</h2><form id="loginForm"><label>Sähköposti<input id="email" type="email" required></label><label>Salasana<input id="password" type="password" required></label><button>Kirjaudu</button><p id="loginError" class="error"></p></form></section><section id="inbox" class="inbox hidden"><aside class="panel"><h2>Keskustelut</h2><button id="refresh" class="secondary">Päivitä</button><div id="conversations"></div><button id="logout" class="secondary">Kirjaudu ulos</button></aside><section class="panel"><h2 id="threadTitle">Valitse keskustelu</h2><div id="messages" class="messages">Valitse keskustelu.</div><form id="replyForm" class="reply"><input id="replyText" placeholder="Kirjoita vastaus…" maxlength="4000" required disabled><button id="sendReply" disabled>Lähetä</button></form></section></section></main><script src="config.js"></script><script src="api.js"></script><script src="admin.js"></script></body></html>
